expected:
  working_days: 10          # Aug 3 (Mon) - Aug 16 (Sun)
  capacity:
    # Avery: M 2 + L 3.5 + XS 0.5 + `-` 0 + M 2 + S 1 = 9.0. Sized `-` adds no
    # unestimated count, so the delta is NOT suppressed. The two carryover
    # tickets are cycle members and count toward load like any other.
    - { person: Avery, load: 9.0,  available: 10.0, delta: -1.0, verdict: UNDER }
    # Blake: zero issues. EMPTY outranks UNDER.
    - { person: Blake, load: 0.0,  available: 10.0, delta: null, verdict: EMPTY }
    # Chen: M 2 + L 3.5 + XS 0.5 = 6.0 sized, plus 3 with no estimate.
    - { person: Chen,  load: 6.0,  available: 10.0, delta: null, verdict: "UNDER?",
        render_load: "6.0d+", notes: "3 unestimated" }
    # Dara: XXL 10 + L 3.5 + S 1 = 14.5 against 10.0
    - { person: Dara,  load: 14.5, available: 10.0, delta: 4.5,  verdict: OVER }
  no_estimate: [ENG-201, ENG-233, ENG-240]     # ENG-260 must NOT appear
  needs_split:
    - { id: ENG-190, assignee: Dara Okafor, size: XXL, title: rewrite ingest pipeline }
  unassigned_in_cycle:
    heading: "UNASSIGNED IN CYCLE (2, 3.0d)"   # M 2.0 + S 1.0
    issues: [ENG-244, ENG-249]
  carryover:

    # cycle 46 is never queried in full, so `issues_that_left` is unknowable.
    heading: "CARRYOVER FROM 46 (2)"
    never_started:
      - { id: ENG-155, assignee: Avery Stone, size: M, title: retry budget for ingest }
    in_progress:
      - { id: ENG-160, assignee: Avery Stone, size: S, days_since_started: 7 }
    in_review: []             # no review-state ticket crosses the boundary
    # Created Aug 1, after cycle 46 started. Planned into 47, not carried over.
    excluded: [ENG-204, ENG-205, ENG-206, ENG-260, ENG-210, ENG-211, ENG-212,
               ENG-201, ENG-233, ENG-240, ENG-190, ENG-191, ENG-192, ENG-244,
               ENG-249, ENG-270, ENG-271, ENG-272]
  unlisted_in_roster:
    # Day total in the heading: M 2.0 + XS 0.5 + S 1.0 = 3.5d, counted in no
    # capacity row. Same reasoning as UNASSIGNED IN CYCLE.
    heading: "UNLISTED IN ROSTER (1, 3.5d)"
    people:
      - { name: Priya Raman, issue_count: 3, days: 3.5 }
  backlog_readiness:
    projects:
      - { project: Gateway rework, ready: 3, unsized: 9, owned_unsched: 2, notes: no lead }
      - { project: Ingest v2,      ready: 4, unsized: 0, owned_unsched: 0 }
      - { project: Auth migration, ready: 0, unsized: 6, owned_unsched: 1 }
    owned_unsched_issues: ["ENG-248 Avery", "ENG-251 Blake", "ENG-263 Chen"]
  sections_omitted: []
  header: "CYCLE 47  prep   Aug 3-16   10 working days"
  footer:
    - "rotations not checked (no schedules configured); available days may be overstated."
    - "3 issues excluded from day totals for having no estimate."
    - "never-started carryover is inferred from creation date; an issue created
       during cycle 46 and never started cannot be told apart from new work."
  traps:
    - ENG-260 is sized `-`. Counting it as unestimated would wrongly suppress
      Avery's -1.0 delta and add a fourth entry to NO ESTIMATE.
    - Chen's row must never render a bare `UNDER` or a computed delta. The
      three unestimated tickets could be anything from 1.5d to 30d.
    - Priya's 3 issues are 3.5d of committed work that appears in no capacity
      row. Without F8 the report silently loses it, and without the day total
      in the heading it understates the hole.
    - Testing created_at against cycle 47's start instead of cycle 46's turns
      17 ordinary tickets into carryover and buries the two real ones.
    - The header renders the calendar range Aug 3-16, not the last weekday
      Aug 14. The working-day count is stated separately.

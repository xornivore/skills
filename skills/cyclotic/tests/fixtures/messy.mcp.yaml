# Fixture: messy — over, empty, unsized, oversized, unassigned, unlisted.
#
# Exercises every prep-mode flag at once, plus the traps that produce a
# plausible-looking wrong report:
#   - ENG-260 is sized `-` (explicit zero). It must NOT count as unestimated,
#     so Avery keeps a real delta.
#   - Chen holds unestimated work, so Chen's load renders with `+`, the delta
#     is suppressed, and the verdict is `UNDER?` — never a bare `UNDER`.
#   - Every ordinary ticket here was created Aug 1, two days before the cycle
#     started. That is normal planning, NOT carryover. Testing created_at
#     against the TARGET cycle's start would report 17 of 20 tickets as
#     carryover. The boundary is the PRIOR cycle's start, Jul 20.
#   - ENG-155 and ENG-160 are the only real carryover, and they are found by
#     two different tests: one inferred from created_at, one proven by
#     started_at.

config:
  group: infra
  team: Engineering
  team_id: c739cf23-0000-0000-0000-000000000000
  members: [Avery Stone, Blake Ruiz, Chen Ito, Dara Okafor]
  labels: []
  capacity:
    oncall_cost_days: 5
    sizes:
      0:  { label: "-",    days: 0 }
      1:  { label: XS,     days: 0.5 }
      2:  { label: S,      days: 1 }
      3:  { label: M,      days: 2 }
      5:  { label: L,      days: 3.5 }
      8:  { label: XL,     days: 5 }
      13: { label: XXL,    days: 10 }
      21: { label: XXXL,   days: 15 }
  oncall:
    schedules: []            # empty: on-call lookup disabled entirely

mode: prep
run_date: 2026-08-04        # pinned so days-since-started is reproducible

# One list_cycles(teamId) call returns both of these; `type` is omitted.
# Sorted by startsAt, the isCurrent entry is the target and the one before it
# is the prior cycle.
list_cycles_current:
  - id: cccccccc-0000-0000-0000-000000000000
    title: FY27Q3-10
    number: 47
    startsAt: "2026-08-03T05:00:00.000Z"
    endsAt: "2026-08-17T05:00:00.000Z"     # exclusive: last day is Aug 16
    # Today's snapshot, not a close value. prep reads none of these: the
    # reconciliation is review-only, because the closed cycle is never
    # queried in full here.
    completedIssueCountHistory: [0]
    issueCountHistory: [20]
    completedScopeHistory: [0]
    scopeHistory: [57]
    isCurrent: true

list_cycles_previous:
  - id: dddddddd-0000-0000-0000-000000000000
    title: FY27-9
    number: 46
    # startsAt is the never-started carryover boundary for prep mode.
    startsAt: "2026-07-20T05:00:00.000Z"
    endsAt: "2026-08-03T05:00:00.000Z"
    completedIssueCountHistory: [0, 3, 8]

# Fixture: cycle-close — review mode, mixed carryover states.
#
# This is the fixture that catches the mistake the whole carryover design
# exists to avoid. Cycle 46 is closed, so it holds ONLY completed and
# canceled issues: Linear rolled every unfinished issue into cycle 47.
#
# Two traps:
#   1. Reading carryover from cycle 46 finds nothing. Read cycle 47.
#   2. The landed denominator must come from issueCountHistory (14), not from
#      counting cycle 46's current members (9). Otherwise the report says
#      "landed 7 of 9" — a 78% success rate — when the truth is 7 of 14.

config:
  group: infra
  team: Engineering
  team_id: c739cf23-0000-0000-0000-000000000000
  members: [Avery Stone, Blake Ruiz, Chen Ito, Dara Okafor]
  labels: []
  capacity:
    oncall_cost_days: 5
    sizes:
      0:  { label: "-",    days: 0 }
      1:  { label: XS,     days: 0.5 }
      2:  { label: S,      days: 1 }
      3:  { label: M,      days: 2 }
      5:  { label: L,      days: 3.5 }
      8:  { label: XL,     days: 5 }
      13: { label: XXL,    days: 10 }
      21: { label: XXXL,   days: 15 }
  oncall:
    schedules:
      - { name: Interrupts, id: 01ABCDEFGHIJKLMNOPQRSTUVWX }

mode: review
run_date: 2026-08-03        # pinned so days-since-started is reproducible
# review targets the most recently completed cycle: list_cycles type=previous.
# The cycle work rolled INTO is the active one, so the heading names cycle 47.

list_cycles_previous:                     # TARGET
  - id: dddddddd-0000-0000-0000-000000000000
    title: FY27-9
    number: 46
    startsAt: "2026-07-20T05:00:00.000Z"
    endsAt: "2026-08-03T05:00:00.000Z"    # exclusive: last day is Aug 2
    # Last element is the value at close: 14 issues in, 7 completed.
    completedIssueCountHistory: [0, 0, 1, 3, 5, 7]
    issueCountHistory: [11, 11, 12, 12, 14, 14]
    completedScopeHistory: [0, 0, 2, 8, 19, 24]
    scopeHistory: [30, 30, 33, 33, 39, 39]
    isCurrent: false

list_cycles_current:                      # the cycle work rolled into
  - id: cccccccc-0000-0000-0000-000000000000
    title: FY27Q3-10
    number: 47
    startsAt: "2026-08-03T05:00:00.000Z"
    endsAt: "2026-08-17T05:00:00.000Z"
    completedIssueCountHistory: [0]
    issueCountHistory: [9]
    completedScopeHistory: [0]
    scopeHistory: [31]
    isCurrent: true

# list_issues(cycle: 46) — 9 members, every one completed or canceled.

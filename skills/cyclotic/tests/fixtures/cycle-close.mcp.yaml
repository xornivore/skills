# Querying cycle 46 for issues that are not completed and not canceled.
# Empty, because a closed cycle cannot hold unfinished work.
target_cycle_incomplete_issues: []

# list_issues(cycle: 47) — where the unfinished work actually went.
# Boundary B for review mode is cycle 46's endsAt: 2026-08-03T05:00:00Z.
landing_cycle_issues:
  # Started Jul 22, before B: in flight during cycle 46. CARRYOVER.
  - { id: ENG-110, title: session store cutover, estimate: { value: 5, name: L }, assignee: Chen Ito,    status: In Progress, statusType: started,   project: Auth migration, startedAt: "2026-07-22T10:00:00.000Z", createdAt: "2026-07-19T08:00:00.000Z" }
  # Created Jul 21, before B, still unstarted. CARRYOVER, never started.
  - { id: ENG-111, title: retry budget,          estimate: { value: 3, name: M }, assignee: Blake Ruiz,  status: Todo,        statusType: unstarted, project: Gateway rework, createdAt: "2026-07-21T08:00:00.000Z" }
  # Started Jul 28, before B, and sitting in a review state. CARRYOVER.
  - { id: ENG-112, title: token refresh race,    estimate: { value: 2, name: S }, assignee: Avery Stone, status: In Review,   statusType: started,   project: Auth migration, startedAt: "2026-07-28T09:00:00.000Z", createdAt: "2026-07-20T08:00:00.000Z" }
  # DECOY: started Aug 4, after B. New work in cycle 47, NOT carryover.
  - { id: ENG-250, title: cache the label lookup, estimate: { value: 3, name: M }, assignee: Avery Stone, status: In Progress, statusType: started,   project: Gateway rework, startedAt: "2026-08-04T09:00:00.000Z", createdAt: "2026-08-03T18:00:00.000Z" }
  # DECOY: created Aug 5, after B. Planned into 47, NOT carryover.
  - { id: ENG-251, title: trim the debug output, estimate: { value: 2, name: S }, assignee: Dara Okafor, status: Todo,        statusType: unstarted, project: Gateway rework, createdAt: "2026-08-05T09:00:00.000Z" }
  # Created Jul 25, before B, still unstarted: CARRYOVER, never started. Also
  # has no estimate key, so it lands in the uncounted list too and contributes
  # the `+` to the day denominator.
  - { id: ENG-252, title: audit the scope claims, assignee: Chen Ito, status: Todo, statusType: unstarted, project: Auth migration, createdAt: "2026-07-25T08:00:00.000Z" }

# The team's review-state wording, for the in-review bucket.
team_review_state_names: [In Review]

oncall_shifts: []            # incident.io MCP unavailable in this fixture

expected:
  working_days: 10          # Jul 20 (Mon) - Aug 2 (Sun)
  landed:
    # Numerator: cycle 46 members with statusType completed = 7.
    # Denominator: issueCountHistory last element = 14. NOT the 9 current
    # members, and NOT 14 minus the 2 canceled.
    issues: "7 of 14"
    # Completed days summed per issue: 2 + 3.5 + 1 + 0.5 + 2 + 5 + 1 = 15.0
    # Days known: the 9 current members (15.0 completed + M 2 + S 1 canceled
    # = 18.0) plus the sized attributed carryover (L 3.5 + M 2 + S 1 = 6.5)
    # = 24.5. ENG-252 has no estimate and one issue that left is
    # unattributed, so the denominator carries `+` for the unknown remainder.
    days: "15.0d of 24.5d+"
  carryover:
    # Heading count and point total come from the cycle's own history:
    # 14 at close minus 9 current members = 5 issues left; 39 - 29 = 10 pts.
    heading: "CARRYING INTO 47 (5 issues, 10 pts)"
    never_started:
      - { id: ENG-111, assignee: Blake Ruiz, size: M, title: retry budget }
      - { id: ENG-252, assignee: Chen Ito, size: null, title: audit the scope claims }
    in_progress:
      - { id: ENG-110, assignee: Chen Ito, size: L, days_since_started: 12 }
    in_review:
      - { id: ENG-112, assignee: Avery Stone, size: S, days_since_started: 6 }
    excluded: [ENG-250, ENG-251]
  no_estimate_so_uncounted: [ENG-252]
  reconciliation:
    issue_count_at_close: 14
    current_members: 9
    issues_that_left: 5
    attributed: 4               # ENG-110, ENG-111, ENG-112, ENG-252
    unattributed: 1             # named in the footer, never padded into the list
  footer:
    - "rotations not checked (incident.io MCP not installed); available days may be overstated."
    - "1 issue excluded from day totals for having no estimate."
    - "1 issue left cycle 46 that could not be matched to a named ticket."
  sections_omitted: [capacity table, NEEDS SPLIT, UNASSIGNED IN CYCLE,
                     BACKLOG BEHIND THE CYCLE, UNLISTED IN ROSTER]
  traps:
    - Reading carryover from cycle 46 yields an empty section, and the report
      then claims a clean close. The unfinished work is in cycle 47.
    - "Counting cycle 46's current members gives \"landed 7 of 9\" instead of
      7 of 14, flattering the cycle by hiding the 5 issues that rolled out."
    - ENG-250 and ENG-251 both sit in cycle 47 and are both unfinished, but
      both began after cycle 46 closed. Including them inflates carryover
      with work that was never part of cycle 46.
    - No per-person completion figure appears anywhere. The landed line is
      team level only.

  - { id: ENG-102, title: backfill tooling,       estimate: { value: 5, name: L },  assignee: Avery Stone, status: Done,     statusType: completed, project: Ingest v2 }
  - { id: ENG-103, title: metrics for the cut,    estimate: { value: 2, name: S },  assignee: Blake Ruiz,  status: Done,     statusType: completed, project: Ingest v2 }
  - { id: ENG-104, title: rename the config key,  estimate: { value: 1, name: XS }, assignee: Blake Ruiz,  status: Done,     statusType: completed, project: Ingest v2 }
  - { id: ENG-105, title: auth cache warmup,      estimate: { value: 3, name: M },  assignee: Chen Ito,    status: Done,     statusType: completed, project: Auth migration }
  - { id: ENG-106, title: partition the queue,    estimate: { value: 8, name: XL }, assignee: Dara Okafor, status: Done,     statusType: completed, project: Ingest v2 }
  - { id: ENG-107, title: alert on lag,           estimate: { value: 2, name: S },  assignee: Dara Okafor, status: Done,     statusType: completed, project: Ingest v2 }
  - { id: ENG-108, title: drop the legacy path,   estimate: { value: 3, name: M },  assignee: Chen Ito,    status: Canceled, statusType: canceled,  project: Auth migration }

  group: infra
  team: Engineering
  team_id: c739cf23-0000-0000-0000-000000000000
  members: [Avery Stone, Blake Ruiz, Chen Ito, Dara Okafor]
  labels: []
  capacity:
    oncall_cost_days: 5
    sizes:
      0:  { label: "-",    days: 0 }
      1:  { label: XS,     days: 0.5 }
      2:  { label: S,      days: 1 }
      3:  { label: M,      days: 2 }
      5:  { label: L,      days: 3.5 }
      8:  { label: XL,     days: 5 }
      13: { label: XXL,    days: 10 }
      21: { label: XXXL,   days: 15 }
  oncall:

# Fixture: healthy — everything sized, everything assigned, cycle in balance.
#
# Agent-verifiable scenario, not an automated test. Read it, run the arithmetic
# from references/capacity.md by hand, and compare against `expected` below.
#
# Shapes mirror real Linear MCP responses: null fields are OMITTED, issue `id`
# is the human identifier, `estimate` is an object with `value` and `name`.


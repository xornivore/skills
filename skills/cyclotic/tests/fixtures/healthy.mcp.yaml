# Nothing classifies as carryover, on both tests:
#   in_flight     = cycle 51 startsAt = 2026-09-07. ENG-301 is the only started
#                   issue and it began Sep 8, after the cycle opened.
#   never_started = cycle 50 startsAt = 2026-08-24. Every ticket was created
#                   Sep 2, well after that, so all of it is work planned into
#                   cycle 51 during cooldown.
# Testing created_at against cycle 51's start instead would match all 15
# unstarted tickets and report this balanced cycle as almost entirely carryover.


  - schedule: Interrupts
    user_email: blake@example.com
    start: "2026-09-07T00:00:00.000Z"
    end: "2026-09-12T00:00:00.000Z"       # Mon Sep 7 - Fri Sep 11, 5 weekdays

expected:
  header: "CYCLE 51  prep   Sep 7-20   10 working days"
  working_days: 10          # Sep 7 (Mon) - Sep 20 (Sun); Sep 7-11 + Sep 14-18
  capacity:
    # Avery: L 3.5 + L 3.5 + M 2 + S 1 = 10.0 against 10.0
    - { person: Avery, load: 10.0, available: 10.0, delta:  0.0, verdict: full }
    # Blake: L 3.5 + XS 0.5 = 4.0 against 10 - 5 rotation = 5.0
    - { person: Blake, load:  4.0, available:  5.0, delta: -1.0, verdict: UNDER,
        notes: "oncall: Interrupts Sep 7-11" }
    # Chen: M 2 + M 2 + L 3.5 + S 1 + XS 0.5 + XS 0.5 = 9.5 against 10.0
    - { person: Chen,  load:  9.5, available: 10.0, delta: -0.5, verdict: UNDER }
    # Dara: L 3.5 + L 3.5 + M 2 + S 1 = 10.0 against 10.0
    - { person: Dara,  load: 10.0, available: 10.0, delta:  0.0, verdict: full }
  sections_omitted: [CARRYOVER, NO ESTIMATE, NEEDS SPLIT, UNASSIGNED IN CYCLE, UNLISTED IN ROSTER]
  backlog_readiness:
    # every issue is unassigned and sized, so all land in `ready`
    - { project: Ingest v2,      ready: 4, unsized: 0, owned_unsched: 0 }
    - { project: Gateway rework, ready: 3, unsized: 0, owned_unsched: 0 }
  footer:
    - "rotations checked: Interrupts."
    # Renders even though the bucket came back empty. An empty bucket is
    # exactly the case a reader would otherwise take as proof.
    - "never-started carryover is inferred from creation date; an issue created
       during cycle 50 and never started cannot be told apart from new work."
  notes: >
    The capacity table still renders even though every row is unremarkable —
    four balanced rows are the answer to "is this cycle allocated." No other
    section appears.
